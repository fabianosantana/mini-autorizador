server:
  port: 8080

spring:
  application:
    name: mini-autorizador
  datasource:
    url: jdbc:h2:file:./data/miniautorizador;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
